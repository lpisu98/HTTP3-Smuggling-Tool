version: "3"
services:
  haproxy:
    build:
      context: ./haproxy
      dockerfile: Dockerfile
      args:
        - haproxy_version=vuln
        #- haproxy_version=patched
        #- haproxy_version=latest
    ports:
      - "80:80"
      - "0.0.0.0:443:443/tcp"
      - "0.0.0.0:443:443/udp" # Open UDP for quic procol, fix ICMP error.
    depends_on:
      - backend-server
  backend-server:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"

